<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfbfd" />

    <!-- Type: Archivo (grotesque) · JetBrains Mono (technical labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>omni-doc-viewer — view PDF, Word, Excel & PowerPoint in the browser</title>
    <meta
      name="description"
      content="Free, open-source React/JS document viewer for PDF, Word (.docx), Excel (.xlsx) and PowerPoint (.pptx). 100% client-side — no server, no Microsoft iframe, no API keys."

    <meta name="keywords" content="pdf viewer, docx viewer, xlsx viewer, pptx viewer, react document viewer, client-side office viewer" />
    <link rel="canonical" href="https://akbhuker.github.io/omni-doc-viewer/" />

    <!-- Open Graph / Twitter (nicer link previews when shared) -->
    <meta property="og:type" content="website" />

    <meta
      property="og:description"
      content="Free, open-source, 100% client-side viewer for PDF, Word, Excel and PowerPoint. No server, no Microsoft iframe, no API keys."
    />
    <meta property="og:url" content="https://akbhuker.github.io/omni-doc-viewer/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="omni-doc-viewer — PDF · Word · Excel · PowerPoint, client-side" />
    <meta
      name="twitter:description"
      content="Free, open-source, 100% client-side viewer for PDF, Word, Excel and PowerPoint."
    />

    <link rel="stylesheet" href="/src/styles.css" />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
